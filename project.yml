name: CodexPets
configs:
  Debug: debug
  Release: release
  AppStore: release

options:
  bundleIdPrefix: com.decodegroup
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hans

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEAD_CODE_STRIPPING: YES
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  CodexPets:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources
        excludes:
          - Info.plist
          - CodexPets-AppStore.entitlements
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.decodegroup.codexpets
        INFOPLIST_FILE: Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        # GitHub Preview 保持独立分发行为；AppStore 配置单独开启沙盒。
        ENABLE_APP_SANDBOX: NO
      configs:
        AppStore:
          CODE_SIGN_ENTITLEMENTS: Resources/CodexPets-AppStore.entitlements
          DEVELOPMENT_TEAM: 66HPXF4XN5
          ENABLE_APP_SANDBOX: YES
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) APP_STORE"
    dependencies: []

  CodexPetsTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: CodexPets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.decodegroup.codexpets.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  CodexPets:
    build:
      targets:
        CodexPets: all
        CodexPetsTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CodexPetsTests
    archive:
      config: AppStore
