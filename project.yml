name: CodexPets
options:
  bundleIdPrefix: com.decodegroup
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hans

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEAD_CODE_STRIPPING: YES
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  CodexPets:
    type: application
    platform: macOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.decodegroup.codexpets
        INFOPLIST_FILE: Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        # 沙盒关闭：MVP 走 Developer ID 独立分发。
        # 若日后上 Mac App Store，需开启沙盒并重新评估
        # 开机自启（SMAppService）与全局快捷键的可用性。
        ENABLE_APP_SANDBOX: NO
    resources:
      - path: Resources
        excludes:
          - Info.plist
    dependencies: []

  CodexPetsTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: CodexPets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.decodegroup.codexpets.tests
        GENERATE_INFOPLIST_FILE: YES
